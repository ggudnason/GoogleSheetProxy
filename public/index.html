<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Proxy</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1b1d21; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --accent-text: #fff; --ok: #15803d; --ok-bg: #dcfce7; --err: #b91c1c; --err-bg: #fee2e2;
    --code-bg: #f1f3f6; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa1ac; --line: #2a2f38;
      --accent: #3b82f6; --ok: #4ade80; --ok-bg: #12301d; --err: #f87171; --err-bg: #3a1515;
      --code-bg: #20242c; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    max-width: 1000px; margin: 0 auto; padding: 28px 16px 8px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; color: var(--muted); }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 16px 60px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 15px; }
  .card-body { padding: 14px 16px; }
  a { color: var(--accent); }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--err); }
  button.link, .btn.link { border: 0; background: none; padding: 2px 6px; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { display: grid; gap: 4px; font-weight: 500; }
  label .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .row > label { flex: 1; min-width: 180px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--code-bg); color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.err { background: var(--err-bg); color: var(--err); }
  code, .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .url { background: var(--code-bg); padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; display: inline-block; }
  .tabs { width: 100%; border-collapse: collapse; }
  .tabs td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tabs tr:first-child td { border-top: 0; }
  .tabs td.name { font-weight: 500; width: 22%; }
  .tabs td.actions { text-align: right; white-space: nowrap; width: 1%; }
  .error-box { color: var(--err); background: var(--err-bg); padding: 10px 12px; border-radius: 7px; overflow-wrap: anywhere; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 0;
    width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: grid; gap: 14px; padding: 20px; }
  dialog h3 { margin: 0; }
  dialog .buttons { display: flex; justify-content: end; gap: 8px; }
  #preview { width: min(1000px, calc(100vw - 32px)); }
  #preview .wrap { padding: 0 20px 20px; }
  .table-scroll { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
  .data { border-collapse: collapse; width: 100%; font-size: 13px; }
  .data th, .data td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .data th { position: sticky; top: 0; background: var(--code-bg); }
  .data td.n { color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .switch { appearance: none; -webkit-appearance: none; width: 36px; height: 20px; border-radius: 999px; margin: 0;
    background: var(--line); position: relative; cursor: pointer; transition: background .15s; flex: none; border: 0; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch:checked { background: var(--ok); }
  .switch:checked::after { transform: translateX(16px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch-row { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; min-height: 34px; }
  .pill.paused { background: #fef3c7; color: #92400e; }
  @media (prefers-color-scheme: dark) { .pill.paused { background: #3a2a0a; color: #fbbf24; } }
  #sheets { display: grid; gap: 10px; }
  .sheets-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .sheets-toolbar h2 { margin: 0; font-size: 14px; flex: 1; }
  .card[data-card] .card-head { cursor: pointer; user-select: none; }
  .card[data-card] .card-head:hover h2 { color: var(--accent); }
  .chevron { border: 0; background: none; padding: 4px; margin: -4px 0 -4px -4px; color: var(--muted); line-height: 0; }
  .chevron svg { transition: transform .15s; }
  .card.collapsed .chevron svg { transform: rotate(-90deg); }
  .card.collapsed .card-head { border-bottom: 0; }
  .card.collapsed > :not(.card-head) { display: none; }
  .card.collapsed .head-actions button { display: none; } /* a closed card only shows its status */
  .card-head .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  .dot.paused { background: var(--warn); opacity: .6; }
  .dot.flash { animation: pulse 1s ease-out; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent); transform: scale(1.4); }
    100% { box-shadow: 0 0 0 9px transparent; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .dot.flash { animation: none; } }
  .age { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .age.old { color: var(--warn); }
  .toggle-part { display: inline-flex; align-items: center; gap: 10px; }
  .refresh-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  :root { --warn: #92400e; --warn-bg: #fef3c7; --info: #1e40af; --info-bg: #dbeafe; }
  @media (prefers-color-scheme: dark) { :root { --warn: #fbbf24; --warn-bg: #3a2a0a; --info: #93c5fd; --info-bg: #172554; } }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .notice { margin: 10px 16px 0; padding: 10px 12px; border-radius: 7px; overflow-wrap: anywhere; }
  .notice:last-child { margin-bottom: 10px; }
  .notice b { font-weight: 600; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .notice.err { background: var(--err-bg); color: var(--err); }
  .notice.info { background: var(--info-bg); color: var(--info); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .notice.info span { flex: 1; min-width: 200px; }
  .notice .detail { display: block; font-size: 12px; opacity: .8; margin-top: 2px; }
  .notice-area:empty { display: none; }
  .notice-area { border-bottom: 1px solid var(--line); }
  #conn-banner { position: sticky; top: 0; z-index: 5; }
  #usage.high { color: var(--warn); }
  .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 640px) {
    .card-head .grow { flex-basis: 100%; }
    .tabs td.name { width: auto; }
    .tabs tr { display: grid; grid-template-columns: 1fr auto; }
    .tabs td { border-top: 0; }
    .tabs tr + tr { border-top: 1px solid var(--line); }
    .tabs td.urlcell { grid-column: 1 / -1; grid-row: 2; padding-top: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Google Sheet Proxy</h1>
    <p>Each tab of each sheet is a JSON data source for vMix.</p>
    <p class="small" id="usage"></p>
  </div>
  <button class="primary" id="add-btn">+ Add sheet</button>
</header>

<main>
  <div id="conn-banner" class="notice err" style="margin:0" hidden></div>
  <section class="card" id="all-card" hidden>
    <div class="card-body">
      <table class="tabs"><tr>
        <td class="name">Everything<div class="small muted" style="font-weight:400">Every row of every sheet, with Sheet and Tab columns</div></td>
        <td class="urlcell"><span class="url" id="all-url"></span></td>
        <td class="actions">
          <button class="link" id="all-copy">Copy</button>
          <a class="btn link" id="all-open" target="_blank" rel="noopener" style="border:0;padding:2px 6px">Open</a>
        </td>
      </tr></table>
    </div>
  </section>

  <div class="sheets-toolbar" id="sheets-toolbar" hidden>
    <h2 id="sheets-count"></h2>
    <button class="link" id="expand-all">Expand all</button>
    <button class="link" id="collapse-all">Collapse all</button>
  </div>
  <div id="sheets"></div>
</main>

<dialog id="sheet-dialog">
  <form method="dialog" id="sheet-form">
    <h3 id="sheet-dialog-title">Add sheet</h3>
    <label>Name
      <input name="name" required placeholder="e.g. Election results">
    </label>
    <label>Spreadsheet URL or ID
      <input name="spreadsheetId" required placeholder="https://docs.google.com/spreadsheets/d/…">
      <span class="hint">The sheet must be shared as “Anyone with the link → Viewer”.</span>
    </label>
    <label>URL name <span class="hint">Used in the JSON URL. Leave blank to generate it from the name.</span>
      <input name="slug" placeholder="election-results" pattern="[A-Za-z0-9\-_ ]*">
    </label>
    <label>Google API key
      <input name="apiKey" type="password" autocomplete="off">
      <span class="hint" id="api-key-hint">A Google Cloud API key with the Google Sheets API enabled.</span>
    </label>
    <div class="row" style="align-items:start">
      <label style="max-width:200px">Cache (seconds)
        <input name="cacheSeconds" type="number" min="0" max="86400" step="1" required>
        <span class="hint">How long to reuse Google’s answer before asking again.</span>
      </label>
      <label>Auto refresh
        <span class="switch-row"><input type="checkbox" name="refresh" class="switch"> <span id="refresh-label"></span></span>
        <span class="hint">When off, vMix keeps getting the last fetched data until you turn it back on.</span>
      </label>
    </div>
    <div id="sheet-error" class="error-box" hidden></div>
    <div class="buttons">
      <button type="button" value="cancel" id="sheet-cancel">Cancel</button>
      <button class="primary" type="submit" id="sheet-submit">Add sheet</button>
    </div>
  </form>
</dialog>

<dialog id="preview">
  <form method="dialog" style="padding:16px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h3 class="grow" id="preview-title"></h3>
    <button type="button" id="preview-refresh">Refresh</button>
    <button>Close</button>
  </form>
  <div class="wrap">
    <p class="small"><span class="url" id="preview-url"></span></p>
    <div id="preview-body"></div>
  </div>
</dialog>

<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const base = location.origin;
let state = { sheets: [] };
let clockOffset = 0; // server time - browser time, for retry countdowns
const POLL_MS = 3000;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Copied');
}

const tabUrl = (slug, tab) => `${base}/sheet/${encodeURIComponent(slug)}/${encodeURIComponent(tab)}`;
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const secondsUntil = (iso) => Math.max(0, Math.round((new Date(iso) - (Date.now() + clockOffset)) / 1000));

// ---------- rendering ----------
// Each card is split into parts that are only redrawn when their content changes,
// so the page can refresh every few seconds without flicker or lost clicks.

// ---------- live "updated Ns ago" ----------
function dotClass(s) {
  if (!s.refresh) return 'paused';
  return { ok: 'ok', stale: 'warn', error: 'err', starting: '' }[s.health.state];
}
function dotTitle(s) {
  if (!s.refresh) return 'Paused: not polling Google';
  return { ok: 'Polling Google normally', stale: 'Google is failing: serving the last good data', error: 'Google is failing and there is no data yet', starting: 'Connecting' }[s.health.state];
}

const retryText = (iso) => (secondsUntil(iso) ? ` · retrying in ${secondsUntil(iso)}s` : ' · retrying now…');

function fmtAgo(sec) {
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s`;
  return `${Math.floor(sec / 3600)}h ${String(Math.floor(sec / 60) % 60).padStart(2, '0')}m`;
}

/** Text and "is this old?" for one sheet, relative to the server's clock. */
function ageInfo(s) {
  const h = s.health;
  if (!h.dataUpdatedAt) {
    if (!s.refresh) return { text: 'no data held yet', old: false };
    const retry = h.nextRetryAt ? retryText(h.nextRetryAt) : '';
    return { text: (h.state === 'error' ? 'no data yet' : 'waiting for first update') + retry, old: h.state === 'error' };
  }
  const sec = Math.max(0, Math.round((Date.now() + clockOffset - new Date(h.dataUpdatedAt)) / 1000));
  if (!s.refresh) return { text: `holding data from ${fmtAgo(sec)} ago`, old: false };
  let text = `updated ${fmtAgo(sec)} ago`;
  if (h.nextRetryAt) text += retryText(h.nextRetryAt);
  // Older than a few poll periods means updates aren't coming through.
  return { text, old: sec > Math.max(3 * s.cacheSeconds, s.cacheSeconds + 10) };
}

function tickAges() {
  for (const s of state.sheets) {
    const el = document.querySelector(`section[data-card="${CSS.escape(s.slug)}"] [data-age]`);
    if (!el) continue;
    const { text, old } = ageInfo(s);
    if (el.textContent !== text) el.textContent = text;
    el.classList.toggle('old', old);
  }
}
setInterval(tickAges, 1000);

const lastSeenUpdate = {}; // slug -> dataUpdatedAt we last showed, to pulse the dot on new data

function headHtml(s) {
  const h = s.health;
  const title = h.title && h.title !== s.name ? ` <span class="muted small">(${esc(h.title)})</span>` : '';
  const pill = {
    starting: '<span class="pill">Connecting…</span>',
    ok: h.tabs ? `<span class="pill ok">${h.tabs.length} tab${h.tabs.length === 1 ? '' : 's'}</span>` : '<span class="pill ok">OK</span>',
    stale: '<span class="pill warn">Using last good data</span>',
    error: '<span class="pill err">Error</span>',
  }[h.state];
  const live = s.refresh ? '<span class="pill ok">Live</span>' : '<span class="pill paused">Paused</span>';
  return `<div class="grow">
      <div class="title-row">
        <button class="chevron" data-collapse="${esc(s.slug)}" aria-label="Show or hide ${esc(s.name)}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <h2>${esc(s.name)}${title}</h2>
        <span class="dot ${dotClass(s)}" data-dot title="${esc(dotTitle(s))}"></span>
        <span class="age" data-age></span>
      </div>
      <div class="small muted">
        /sheet/<b>${esc(s.slug)}</b>
        · <a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(s.spreadsheetId)}/edit" target="_blank" rel="noopener">Open in Google Sheets</a>
        · ${s.apiKeySet ? `key ${esc(s.apiKeyMasked)}` : '<span style="color:var(--err)">no API key</span>'}
      </div>
    </div>
    <div class="head-actions">
      ${pill}
      ${live}
      <button data-check="${esc(s.slug)}" title="Try Google right now">Check</button>
      <button data-edit="${esc(s.slug)}">Edit</button>
      <button class="danger" data-delete="${esc(s.slug)}">Delete</button>
    </div>`;
}

function toggleHtml(s) {
  return `<label class="switch-row" title="Turn off to freeze the data vMix receives">
      <input type="checkbox" class="switch" data-toggle="${esc(s.slug)}" ${s.refresh ? 'checked' : ''}>
      Auto refresh
    </label>`;
}

function infoHtml(s) {
  const h = s.health;
  const updated = h.dataUpdatedAt ? fmtTime(h.dataUpdatedAt) : null;
  if (s.refresh) {
    return `<span class="small muted">Cache ${s.cacheSeconds}s${updated ? ` · data from ${updated}` : ''}</span>`;
  }
  return `<span class="small muted">${updated ? `Holding data fetched at ${updated}` : 'Will fetch once on the first request, then hold'}</span>
    <button class="link" data-fetch="${esc(s.slug)}">Fetch latest once</button>`;
}

function noticesHtml(s) {
  const h = s.health;
  const out = [];
  const retry = h.nextRetryAt && s.refresh
    ? ` Trying again in ${secondsUntil(h.nextRetryAt) || 'a moment'}${secondsUntil(h.nextRetryAt) ? 's' : ''} (attempt ${h.consecutiveFailures + 1}).`
    : '';
  const detail = h.lastErrorDetail && h.lastErrorDetail !== h.lastError
    ? `<span class="detail">Google said: ${esc(h.lastErrorDetail)}</span>` : '';

  if (h.state === 'stale') {
    out.push(`<div class="notice warn"><b>${esc(h.lastError)}</b> vMix keeps getting the data from ${fmtTime(h.dataUpdatedAt)}.${retry}${detail}</div>`);
  } else if (h.state === 'error') {
    out.push(`<div class="notice err"><b>${esc(h.lastError)}</b> vMix gets an error for this sheet until it works.${retry}${detail}</div>`);
  } else if (h.errorsLast10Min > 0 && h.lastErrorAt) {
    out.push(`<div class="notice warn small">Recovered. ${h.errorsLast10Min} error${h.errorsLast10Min === 1 ? '' : 's'} in the last 10 minutes; the last one at ${fmtTime(h.lastErrorAt)}: ${esc(h.lastError)}</div>`);
  }
  return out.join('');
}

// Kept separate from the status notice (whose countdown changes every few seconds)
// so its button isn't redrawn under the mouse.
function suggestionHtml(s) {
  const sg = s.health.suggestion;
  if (!sg) return '';
  return `<div class="notice info"><span><b>Suggestion:</b> ${esc(sg.message)}</span>
    <button data-apply-cache="${esc(s.slug)}" data-seconds="${sg.cacheSeconds}">Use ${sg.cacheSeconds}s</button></div>`;
}

function bodyHtml(s) {
  const h = s.health;
  if (!h.tabs) return h.state === 'error' ? '<p class="muted">Tabs will appear once Google answers.</p>' : '<p class="muted">Loading tabs…</p>';
  if (!h.tabs.length) return '<p class="muted">This spreadsheet has no tabs.</p>';
  const allUrl = `${base}/all/${encodeURIComponent(s.slug)}`;
  const allRow = `<tr>
      <td class="name">All tabs<div class="small muted" style="font-weight:400">Every row in one table, with a Tab column</div></td>
      <td class="urlcell"><span class="url">${esc(allUrl)}</span></td>
      <td class="actions">
        <button class="link" data-copy="${esc(allUrl)}">Copy</button>
        <a class="btn link" href="${esc(allUrl)}" target="_blank" rel="noopener">Open</a>
      </td></tr>`;
  return `<table class="tabs">${allRow}${h.tabs.map((t) => {
    const u = tabUrl(s.slug, t.name);
    return `<tr>
      <td class="name">${esc(t.name)}</td>
      <td class="urlcell"><span class="url">${esc(u)}</span></td>
      <td class="actions">
        <button class="link" data-copy="${esc(u)}">Copy</button>
        <button class="link" data-preview="${esc(s.slug)}" data-tab="${esc(t.name)}">Preview</button>
      </td></tr>`;
  }).join('')}</table>`;
}

/** Set innerHTML only if it changed (keeps focus, hover and clicks intact). */
function patch(el, html) {
  if (el._html !== html) {
    el.innerHTML = html;
    el._html = html;
  }
}

// ---------- collapsed / expanded cards (remembered in this browser) ----------
const OPEN_KEY = 'sheetProxy.openCards';
let openCards = null; // Set of slugs the user expanded; null = no preference saved yet
try {
  const saved = JSON.parse(localStorage.getItem(OPEN_KEY));
  if (Array.isArray(saved)) openCards = new Set(saved);
} catch { /* private window etc.: just don't remember */ }

function saveOpen() {
  try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openCards])); } catch { /* ignore */ }
}

/** With no saved preference, a single sheet starts open and several start collapsed. */
function isOpen(slug) {
  return openCards ? openCards.has(slug) : state.sheets.length === 1;
}

function setOpen(slugs, open) {
  if (!openCards) openCards = new Set(state.sheets.filter((s) => isOpen(s.slug)).map((s) => s.slug));
  for (const slug of slugs) open ? openCards.add(slug) : openCards.delete(slug);
  saveOpen();
  render();
}

function render() {
  const root = $('#sheets');
  $('#sheets-toolbar').hidden = state.sheets.length < 2;
  $('#sheets-count').textContent = `${state.sheets.length} sheets`;
  $('#all-card').hidden = state.sheets.length === 0;

  const u = state.usage;
  if (u && state.sheets.length) {
    const high = u.readsPerMinute > u.quotaPerMinute * 0.8;
    $('#usage').textContent = `About ${u.readsPerMinute} Google requests per minute for all live sheets `
      + `(Google allows ${u.quotaPerMinute} per minute per Google Cloud project${high ? ' — this is close to the limit; raise some cache times' : ''}).`;
    $('#usage').className = 'small ' + (high ? 'high' : 'muted');
  } else {
    $('#usage').textContent = '';
  }

  if (!state.sheets.length) {
    patch(root, `<section class="card empty">No sheets yet. Click <b>+ Add sheet</b> to connect a Google Sheet.</section>`);
    return;
  }
  if (root.querySelector('.empty')) patch(root, '');

  const wanted = state.sheets.map((s) => s.slug);
  // Remove cards for deleted sheets.
  for (const card of [...root.querySelectorAll('section[data-card]')]) {
    if (!wanted.includes(card.dataset.card)) card.remove();
  }
  state.sheets.forEach((s, i) => {
    let card = root.querySelector(`section[data-card="${CSS.escape(s.slug)}"]`);
    if (!card) {
      card = document.createElement('section');
      card.className = 'card';
      card.dataset.card = s.slug;
      card.innerHTML = `<div class="card-head"></div>
        <div class="refresh-bar"><span class="toggle-part"></span><span class="info-part" style="display:contents"></span></div>
        <div class="notice-area"></div>
        <div class="notice-area suggest-area"></div>
        <div class="card-body"></div>`;
    }
    if (root.children[i] !== card) root.insertBefore(card, root.children[i] || null);
    const open = isOpen(s.slug);
    card.classList.toggle('collapsed', !open);
    card.querySelector('.card-head').setAttribute('aria-expanded', String(open));
    patch(card.querySelector('.card-head'), headHtml(s));
    const upd = s.health.dataUpdatedAt;
    if (upd && lastSeenUpdate[s.slug] && upd !== lastSeenUpdate[s.slug]) {
      const dot = card.querySelector('[data-dot]');
      dot.classList.remove('flash');
      void dot.offsetWidth; // restart the animation
      dot.classList.add('flash');
    }
    lastSeenUpdate[s.slug] = upd;
    patch(card.querySelector('.toggle-part'), toggleHtml(s));
    patch(card.querySelector('.info-part'), infoHtml(s));
    patch(card.querySelector('.notice-area:not(.suggest-area)'), noticesHtml(s));
    patch(card.querySelector('.suggest-area'), suggestionHtml(s));
    patch(card.querySelector('.card-body'), bodyHtml(s));
  });
}

function applyState(next) {
  state = next;
  if (next.serverTime) clockOffset = new Date(next.serverTime) - Date.now();
  render();
  tickAges();
}

/** Replace one sheet's entry (from Check / Fetch once responses). */
function applySheet(sheet) {
  const i = state.sheets.findIndex((s) => s.slug === sheet.slug);
  if (i >= 0) state.sheets[i] = sheet;
  render();
  tickAges();
}

// Poll the proxy's own state every few seconds. This never calls Google, and it
// keeps going even if the proxy can't be reached for a while.
async function poll() {
  try {
    applyState(await api('/api/state'));
    $('#conn-banner').hidden = true;
  } catch (e) {
    $('#conn-banner').textContent = `Can’t reach the proxy server (${e.message}). Is it still running? Trying again…`;
    $('#conn-banner').hidden = false;
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

// ---------- actions ----------
async function setRefresh(slug, on, input) {
  input.disabled = true;
  try {
    applyState(await api(`/api/sheets/${encodeURIComponent(slug)}`, { method: 'PUT', body: { refresh: on } }));
    toast(on ? 'Auto refresh on' : 'Paused — vMix keeps the current data');
  } catch (err) {
    toast(err.message);
    input.checked = !on;
  }
  input.disabled = false;
}

async function busy(btn, label, fn) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = label;
  try {
    await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

function checkSheet(slug, btn) {
  return busy(btn, 'Checking…', async () => {
    try {
      const sheet = await api(`/api/sheets/${encodeURIComponent(slug)}/check`, { method: 'POST' });
      applySheet(sheet);
      toast(sheet.health.consecutiveFailures ? sheet.health.lastError : 'Google answered');
    } catch (err) {
      toast(err.message);
    }
  });
}

function fetchOnce(slug, btn) {
  return busy(btn, 'Fetching…', async () => {
    try {
      applySheet(await api(`/api/sheets/${encodeURIComponent(slug)}/reload`, { method: 'POST' }));
      toast('Held data updated');
    } catch (err) {
      toast(`Kept the previous data. ${err.message}`);
    }
  });
}

async function applyCache(slug, seconds, btn) {
  return busy(btn, 'Saving…', async () => {
    try {
      applyState(await api(`/api/sheets/${encodeURIComponent(slug)}`, { method: 'PUT', body: { cacheSeconds: seconds } }));
      toast(`Cache time set to ${seconds}s`);
    } catch (err) {
      toast(err.message);
    }
  });
}

// ---------- add / edit sheet ----------
const dlg = $('#sheet-dialog');
const form = $('#sheet-form');
let editing = null;

function openSheetDialog(sheet) {
  editing = sheet ? sheet.slug : null;
  form.reset();
  $('#sheet-error').hidden = true;
  $('#sheet-dialog-title').textContent = sheet ? `Edit ${sheet.name}` : 'Add sheet';
  $('#sheet-submit').textContent = sheet ? 'Save' : 'Add sheet';
  const hasKey = Boolean(sheet && sheet.apiKeySet);
  form.apiKey.required = !hasKey;
  form.apiKey.placeholder = hasKey ? `Saved (${sheet.apiKeyMasked})` : 'AIza…';
  $('#api-key-hint').textContent = hasKey
    ? 'Leave blank to keep the saved key, or paste a new one to replace it.'
    : 'A Google Cloud API key with the Google Sheets API enabled.';
  form.cacheSeconds.value = sheet ? sheet.cacheSeconds : 5;
  form.refresh.checked = sheet ? sheet.refresh : true;
  syncRefreshLabel();
  if (sheet) {
    form.name.value = sheet.name;
    form.spreadsheetId.value = sheet.spreadsheetId;
    form.slug.value = sheet.slug;
  }
  dlg.showModal();
}

function syncRefreshLabel() {
  $('#refresh-label').textContent = form.refresh.checked ? 'On' : 'Off (paused)';
}
form.refresh.addEventListener('change', syncRefreshLabel);

$('#all-url').textContent = `${base}/all`;
$('#all-open').href = `${base}/all`;
$('#all-copy').onclick = () => copy(`${base}/all`);

$('#add-btn').onclick = () => openSheetDialog(null);
$('#expand-all').onclick = () => setOpen(state.sheets.map((s) => s.slug), true);
$('#collapse-all').onclick = () => setOpen(state.sheets.map((s) => s.slug), false);
$('#sheet-cancel').onclick = () => dlg.close();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: form.name.value,
    spreadsheetId: form.spreadsheetId.value,
    slug: form.slug.value.trim() || undefined,
    apiKey: form.apiKey.value.trim() || undefined,
    cacheSeconds: form.cacheSeconds.value,
    refresh: form.refresh.checked,
  };
  try {
    const wasOpen = editing ? isOpen(editing) : true; // new sheets open so their tabs are visible
    const next = await api(editing ? `/api/sheets/${encodeURIComponent(editing)}` : '/api/sheets',
      { method: editing ? 'PUT' : 'POST', body });
    state = next; // so isOpen sees the new sheet count
    if (editing && next.saved !== editing) setOpen([editing], false); // renamed: carry the state over
    setOpen([next.saved], wasOpen);
    applyState(next);
    dlg.close();
    toast(editing ? 'Sheet saved' : 'Sheet added');
  } catch (err) {
    $('#sheet-error').textContent = err.message;
    $('#sheet-error').hidden = false;
  }
});

// ---------- preview ----------
const pv = $('#preview');
let pvCurrent = null;

async function showPreview(slug, tab) {
  pvCurrent = { slug, tab };
  const u = tabUrl(slug, tab);
  $('#preview-title').textContent = tab;
  $('#preview-url').textContent = u;
  $('#preview-body').innerHTML = '<p class="muted">Loading…</p>';
  if (!pv.open) pv.showModal();
  try {
    const [res, rawRes] = await Promise.all([fetch(u), fetch(u + '?raw')]);
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.error || res.statusText);
    const raw = rawRes.ok ? await rawRes.json() : [];
    const originals = (raw[0] || []).map((h) => String(h ?? '').trim());
    if (!rows.length) { $('#preview-body').innerHTML = '<p class="muted">No data rows.</p>'; return; }
    const cols = Object.keys(rows[0]);
    $('#preview-body').innerHTML = `<p class="small muted">${rows.length} row${rows.length === 1 ? '' : 's'} · ${cols.length} column${cols.length === 1 ? '' : 's'} · add <code>/N</code> to the URL for a single row · column names are the ones vMix sees, with the sheet’s own name underneath when it differs</p>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>#</th>${cols.map((c, i) => {
          const orig = originals[i];
          const sub = orig && orig !== c ? `<div class="small muted" style="font-weight:400" title="Name in the sheet">${esc(orig.replace(/\n/g, ' '))}</div>` : '';
          return `<th>${esc(c)}${sub}</th>`;
        }).join('')}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr><td class="n">${i + 1}</td>${cols.map((c) => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
  } catch (e) {
    $('#preview-body').innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}
$('#preview-refresh').onclick = () => pvCurrent && showPreview(pvCurrent.slug, pvCurrent.tab);

// ---------- delegated events ----------
$('#sheets').addEventListener('change', (e) => {
  if (e.target.dataset.toggle) setRefresh(e.target.dataset.toggle, e.target.checked, e.target);
});

$('#sheets').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  // A click on the card header (but not on its buttons or links) shows/hides the card.
  const head = e.target.closest('.card-head');
  if (head && (!b || b.dataset.collapse) && !e.target.closest('a')) {
    const slug = head.closest('[data-card]').dataset.card;
    return setOpen([slug], !isOpen(slug));
  }
  if (!b) return;
  const d = b.dataset;
  if (d.copy) return copy(d.copy);
  if (d.preview) return showPreview(d.preview, d.tab);
  if (d.check) return checkSheet(d.check, b);
  if (d.fetch) return fetchOnce(d.fetch, b);
  if (d.applyCache) return applyCache(d.applyCache, Number(d.seconds), b);
  if (d.edit) return openSheetDialog(state.sheets.find((s) => s.slug === d.edit));
  if (d.delete) {
    const s = state.sheets.find((x) => x.slug === d.delete);
    if (!confirm(`Remove "${s.name}" from the proxy? vMix data sources using it will stop updating.`)) return;
    try {
      applyState(await api(`/api/sheets/${encodeURIComponent(d.delete)}`, { method: 'DELETE' }));
      toast('Sheet removed');
    } catch (err) {
      toast(err.message);
    }
  }
});

poll();
</script>
</body>
</html>
